name: Verify agent-mail-mcp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and mocked Gmail API tests
        run: npm test

      - name: Build production output
        run: npm run build

      - name: Report verification summary
        if: always()
        run: |
          {
            echo "## agent-mail-mcp verification"
            echo
            echo "- Node.js: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- Trigger: workflow_dispatch"
            echo "- Checks: typecheck, tests with mocked Gmail REST API, production build"
          } >> "$GITHUB_STEP_SUMMARY"
